included:
  - RoutineApp
  - RoutineAppTests
  - RoutineAppUITests
  - RoutineCore/Sources
  - RoutineCore/Tests

excluded:
  - RoutineApp/Assets.xcassets

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_whitespace_closing_braces

reporter: "xcode"

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_function_declarations: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y

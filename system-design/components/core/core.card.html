<!-- @dsCard group="Components" viewport="700x880" name="Core components" subtitle="Routine cards, progress rings, buttons, pills & undo banner" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="../../_ds_bundle.js"></script>
    <style>
      html, body { margin: 0; }
      body {
        background: var(--bg-canvas);
        font-family: var(--font-system);
        padding: 28px;
        color: var(--text-primary);
      }
      .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
      .stack { display: flex; flex-direction: column; gap: 12px; }
      .lbl {
        font-size: var(--text-caption); font-weight: var(--weight-semibold);
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--text-secondary); margin: 0 0 2px 2px;
      }
      .row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
      .ringcell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .ringcell span { font-size: var(--text-caption); color: var(--text-secondary); }
      .btnrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="root" class="wrap"></div>
    <script type="text/babel" data-presets="react">
      const { RoutineCard, ProgressRing, Button, MetadataPill, UndoBanner } =
        window.RoutineDesignSystem_14e910;

      function Demo() {
        return (
          <>
            <div className="stack">
              <RoutineCard name="Morning yoga" count="2/5" period="week" lastDone="Yesterday"
                completed={2} target={5} state="incomplete" />
              <RoutineCard name="Walk the dog" count="3/5" period="week" lastDone="Today"
                completed={3} target={5} state="complete" showEdit />
              <RoutineCard name="Wake up early" count="1/4" period="week"
                availability="Available 12:00 AM–6:45 AM" completed={1} target={4} state="unavailable" />
              <RoutineCard name="Water plants" count="6/5" period="week" lastDone="2d ago"
                completed={6} target={5} state="over-target" />
            </div>

            <div className="stack">
              <p className="lbl">Progress ring</p>
              <div className="row">
                <div className="ringcell"><ProgressRing completed={2} target={5} accent="active" /><span>In progress</span></div>
                <div className="ringcell"><ProgressRing completed={3} target={5} showCheckmark accent="complete" /><span>Done today</span></div>
                <div className="ringcell"><ProgressRing completed={5} target={5} accent="complete" /><span>Target met</span></div>
                <div className="ringcell"><ProgressRing completed={1} target={4} accent="muted" /><span>Unavailable</span></div>
                <div className="ringcell"><ProgressRing completed={3} target={5} showCheckmark accent="complete" size={72} strokeWidth={7} /><span>Summary</span></div>
              </div>
            </div>

            <div className="stack">
              <p className="lbl">Buttons</p>
              <div className="btnrow">
                <Button variant="prominent" tone="active">Add Routine</Button>
                <Button variant="tinted" tone="active">Undo</Button>
                <Button variant="bordered" tone="destructive" size="sm">Remove</Button>
                <Button variant="plain" tone="active">Cancel</Button>
              </div>
            </div>

            <div className="stack">
              <p className="lbl">Metadata pills</p>
              <div className="btnrow">
                <MetadataPill accent="active">3/5</MetadataPill>
                <MetadataPill accent="active">week</MetadataPill>
                <MetadataPill accent="complete" emphasized>5/5</MetadataPill>
                <MetadataPill accent="complete" emphasized>month</MetadataPill>
              </div>
            </div>

            <div className="stack">
              <p className="lbl">Undo banner</p>
              <UndoBanner message="Completed Walk the dog" />
            </div>
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>

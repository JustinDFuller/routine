<!-- @dsCard group="Spacing" viewport="700x200" name="Corner radii" subtitle="Soft, consistent — cards 16 · sheets 18 · rows 14 · capsules" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:24px;color:var(--text-primary)}
      .row{display:flex;gap:18px;align-items:flex-end}
      .cell{display:flex;flex-direction:column;gap:8px;align-items:center}
      .box{width:92px;height:72px;background:var(--surface-sheet);box-shadow:inset 0 0 0 1px var(--border-hairline)}
      .cap{font-size:12px;color:var(--text-secondary);text-align:center}
      .cap b{display:block;color:var(--text-primary);font-weight:600}
    </style>
  </head>
  <body>
    <div class="row">
      <div class="cell"><div class="box" style="border-radius:12px"></div><span class="cap"><b>12</b>controls</span></div>
      <div class="cell"><div class="box" style="border-radius:14px"></div><span class="cap"><b>14</b>rows</span></div>
      <div class="cell"><div class="box" style="border-radius:16px"></div><span class="cap"><b>16</b>cards</span></div>
      <div class="cell"><div class="box" style="border-radius:18px"></div><span class="cap"><b>18</b>sheets</span></div>
      <div class="cell"><div class="box" style="border-radius:999px;width:120px"></div><span class="cap"><b>999</b>capsules</span></div>
    </div>
  </body>
</html>

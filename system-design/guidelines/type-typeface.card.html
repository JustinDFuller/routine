<!-- @dsCard group="Type" viewport="700x200" name="Typeface & weights" subtitle="San Francisco (system) · Regular → Bold" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:26px;color:var(--text-primary)}
      .stack{display:flex;flex-direction:column;gap:14px}
      .glyphs{font-size:40px;font-weight:600;letter-spacing:-.01em}
      .note{font-size:12px;color:var(--text-secondary)}
      .weights{display:flex;gap:28px;align-items:baseline}
      .w{display:flex;flex-direction:column;gap:2px}
      .w span:first-child{font-size:26px}
      .w span:last-child{font-size:11px;color:var(--text-secondary)}
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="glyphs">Aa Bb Cc &nbsp; 0123456789</div>
      <div class="weights">
        <div class="w"><span style="font-weight:400">Routine</span><span>Regular 400</span></div>
        <div class="w"><span style="font-weight:500">Routine</span><span>Medium 500</span></div>
        <div class="w"><span style="font-weight:600">Routine</span><span>Semibold 600</span></div>
        <div class="w"><span style="font-weight:700">Routine</span><span>Bold 700</span></div>
      </div>
      <div class="note">--font-system → SF on Apple devices, neutral sans fallback elsewhere. No custom typeface; relies on Dynamic Type.</div>
    </div>
  </body>
</html>

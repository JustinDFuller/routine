<!-- @dsCard group="Spacing" viewport="700x210" name="Rings & tap targets" subtitle="Ring 34/4.5 · summary 72/7 · minimum target 44" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:24px;color:var(--text-primary)}
      .row{display:flex;gap:40px;align-items:flex-end}
      .cell{display:flex;flex-direction:column;gap:10px;align-items:center}
      .cap{font-size:12px;color:var(--text-secondary);text-align:center}
      .cap b{display:block;color:var(--text-primary);font-weight:600}
      .tap{width:44px;height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--accent-active);display:grid;place-items:center;color:var(--accent-active);font-size:11px}
    </style>
  </head>
  <body>
    <div class="row">
      <div class="cell">
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14.75" fill="none" stroke="var(--ring-track)" stroke-width="4.5"/><circle cx="17" cy="17" r="14.75" fill="none" stroke="var(--accent-active)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="37 56" transform="rotate(-90 17 17)"/></svg>
        <span class="cap"><b>34 / 4.5</b>dashboard</span>
      </div>
      <div class="cell">
        <svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="32.5" fill="none" stroke="var(--ring-track)" stroke-width="7"/><circle cx="36" cy="36" r="32.5" fill="none" stroke="var(--accent-complete)" stroke-width="7" stroke-linecap="round" stroke-dasharray="123 81" transform="rotate(-90 36 36)"/></svg>
        <span class="cap"><b>72 / 7</b>history summary</span>
      </div>
      <div class="cell">
        <div class="tap">44</div>
        <span class="cap"><b>44 × 44</b>min tap target</span>
      </div>
    </div>
  </body>
</html>

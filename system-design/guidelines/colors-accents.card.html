<!-- @dsCard group="Colors" viewport="700x210" name="Accents" subtitle="Complete · Active · Destructive — light / dark pairs" -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:#efeae0;font-family:var(--font-system);padding:24px;color:#24231f}
      .grid{display:flex;gap:14px}
      .col{flex:1;display:flex;flex-direction:column;gap:8px}
      .pair{display:flex;border-radius:12px;overflow:hidden;height:64px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
      .pair > div{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
      .name{font-size:13px;font-weight:600}
      .role{font-size:11px;color:#6d675e}
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="col">
        <span class="name">Accent · Complete</span>
        <div class="pair">
          <div style="background:#4f7a34;color:#fff">#4F7A34</div>
          <div style="background:#a7c77d;color:#16210d">#A7C77D</div>
        </div>
        <span class="role">Completion &amp; progress · warm green</span>
      </div>
      <div class="col">
        <span class="name">Accent · Active</span>
        <div class="pair">
          <div style="background:#2f6472;color:#fff">#2F6472</div>
          <div style="background:#8ea7b8;color:#12222b">#8EA7B8</div>
        </div>
        <span class="role">Selection · focus · nav · teal</span>
      </div>
      <div class="col">
        <span class="name">Accent · Destructive</span>
        <div class="pair">
          <div style="background:#c9342d;color:#fff">#C9342D</div>
          <div style="background:#ff6b6b;color:#3a0c0a">#FF6B6B</div>
        </div>
        <span class="role">Delete &amp; remove · iOS red</span>
      </div>
    </div>
  </body>
</html>

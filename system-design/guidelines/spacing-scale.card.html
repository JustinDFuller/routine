<!-- @dsCard group="Spacing" viewport="700x250" name="Spacing scale" subtitle="Comfortable for thumb use — page 16 · sections 24 · card 14" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:24px;color:var(--text-primary)}
      .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
      .bar{height:14px;border-radius:4px;background:var(--accent-active)}
      .lbl{width:118px;font-size:12px;color:var(--text-secondary)}
      .lbl b{color:var(--text-primary);font-weight:600}
    </style>
  </head>
  <body>
    <div class="row"><span class="lbl"><b>4</b> · space-2</span><div class="bar" style="width:4px"></div></div>
    <div class="row"><span class="lbl"><b>8</b> · pill gap</span><div class="bar" style="width:8px"></div></div>
    <div class="row"><span class="lbl"><b>12</b> · card gap</span><div class="bar" style="width:12px"></div></div>
    <div class="row"><span class="lbl"><b>14</b> · card padding</span><div class="bar" style="width:14px"></div></div>
    <div class="row"><span class="lbl"><b>16</b> · page padding</span><div class="bar" style="width:16px"></div></div>
    <div class="row"><span class="lbl"><b>20</b> · space-10</span><div class="bar" style="width:20px"></div></div>
    <div class="row"><span class="lbl"><b>24</b> · section gap</span><div class="bar" style="width:24px"></div></div>
    <div class="row"><span class="lbl"><b>32</b> · space-16</span><div class="bar" style="width:32px"></div></div>
  </body>
</html>

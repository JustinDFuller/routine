<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:26px;color:var(--text-primary)}
      .row{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--border-hairline)}
      .row:last-child{border-bottom:none}
      .meta{flex-shrink:0;width:130px;font-size:12px;color:var(--text-secondary)}
      .meta b{display:block;color:var(--text-primary);font-size:13px;font-weight:600}
    </style>
  </head>
  <body>
    <div class="row">
      <span class="meta"><b>Large Title</b>34 / 700</span>
      <span style="font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.02em">Today</span>
    </div>
    <div class="row">
      <span class="meta"><b>Title</b>28 / 600</span>
      <span style="font-size:28px;line-height:34px;font-weight:600">Today</span>
    </div>
    <div class="row">
      <span class="meta"><b>Title 3</b>20 / 600</span>
      <span style="font-size:20px;line-height:25px;font-weight:600">No routines yet</span>
    </div>
  </body>
</html>

<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces · Dark" subtitle="Layered dark surface model — the primary appearance" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:24px;color:var(--text-primary)}
      .row{display:flex;gap:14px}
      .sw{flex:1;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:flex-end;box-shadow:inset 0 0 0 1px var(--border-hairline)}
      .name{font-size:13px;font-weight:600}
      .hex{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
      .role{font-size:11px;color:var(--text-secondary)}
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw" style="background:var(--routine-canvas)">
        <span class="name">Canvas</span><span class="hex">#141412</span><span class="role">App background</span>
      </div>
      <div class="sw" style="background:var(--routine-surface)">
        <span class="name">Surface</span><span class="hex">#20201D</span><span class="role">Routine cards</span>
      </div>
      <div class="sw" style="background:var(--routine-surface-elevated)">
        <span class="name">Surface Elevated</span><span class="hex">#2B2A26</span><span class="role">Sheets · active cards</span>
      </div>
    </div>
  </body>
</html>

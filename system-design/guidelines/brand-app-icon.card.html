<!-- @dsCard group="Brand" viewport="700x230" name="App icon" subtitle="Default · Dark · Tinted — the ring-and-check motif" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,body{margin:0}
      body{background:var(--bg-canvas);font-family:var(--font-system);padding:26px;color:var(--text-primary)}
      .row{display:flex;gap:34px;align-items:flex-start}
      .cell{display:flex;flex-direction:column;gap:10px;align-items:center}
      img{width:104px;height:104px;border-radius:23px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.3)}
      .cap{font-size:12px;color:var(--text-secondary)}
      .cap b{display:block;color:var(--text-primary);font-weight:600;text-align:center}
    </style>
  </head>
  <body>
    <div class="row">
      <div class="cell"><img src="../assets/app-icon-default.png" alt="Routine app icon, default" /><span class="cap"><b>Default</b></span></div>
      <div class="cell"><img src="../assets/app-icon-dark.png" alt="Routine app icon, dark" /><span class="cap"><b>Dark</b></span></div>
      <div class="cell"><img src="../assets/app-icon-tinted.png" alt="Routine app icon, tinted" /><span class="cap"><b>Tinted</b></span></div>
    </div>
  </body>
</html>

name: Routine
options:
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
packages:
  RoutineCore:
    path: RoutineCore
targets:
  RoutineApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoutineApp
    info:
      path: RoutineApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Routine
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV2
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.routine
        PRODUCT_NAME: Routine
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: RoutineApp/Routine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justinfuller.routine
    dependencies:
      - package: RoutineCore
        product: RoutineCore
    scheme:
      gatherCoverageData: false
      testTargets:
        - RoutineAppTests
        - RoutineAppUITests

  RoutineAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoutineAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.routine.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Routine.app/Routine
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: RoutineApp

  RoutineAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoutineAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.routine.uitests
    dependencies:
      - target: RoutineApp

  RoutineAppScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoutineAppScreenshotTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.routine.screenshottests
    dependencies:
      - target: RoutineApp
schemes:
  RoutineApp:
    build:
      targets:
        RoutineApp: all
    test:
      gatherCoverageData: false
      targets:
        - name: RoutineAppTests
        - name: RoutineAppUITests
  RoutineScreenshots:
    build:
      targets:
        RoutineApp: all
    test:
      gatherCoverageData: false
      targets:
        - name: RoutineAppScreenshotTests
